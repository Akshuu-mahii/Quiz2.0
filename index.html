<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartQuiz Analytics AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: { 950: '#050508', 900: '#0a0a0f', 800: '#12121a', 700: '#1a1a24', 600: '#22222e' },
            accent: { purple: '#a855f7', blue: '#3b82f6', cyan: '#22d3ee', pink: '#ec4899' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          boxShadow: {
            glow: '0 0 20px rgba(168, 85, 247, 0.15)',
            'glow-cyan': '0 0 20px rgba(34, 211, 238, 0.15)',
            glass: '0 8px 32px rgba(0,0,0,0.4)'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { background: #050508; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(18, 18, 26, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .glass-hover:hover {
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.12);
    }
    .gradient-text {
      background: linear-gradient(135deg, #a855f7, #3b82f6, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      transition: all 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-outline {
      border: 1px solid rgba(168, 85, 247, 0.5);
      transition: all 0.2s;
    }
    .btn-outline:hover { background: rgba(168, 85, 247, 0.15); }
    .progress-ring { transition: stroke-dashoffset 0.8s ease; }
    .nav-link.active { color: #a855f7; border-bottom: 2px solid #a855f7; }
    .option-card.selected { border-color: #a855f7; background: rgba(168, 85, 247, 0.12); }
    .option-card.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.12); }
    .option-card.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.12); }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #12121a; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #3b3b4f; border-radius: 3px; }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }
      50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
    }
    .animate-pulse-glow { animation: pulse-glow 2s infinite; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-dark-950 text-slate-100">
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>
